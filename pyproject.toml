[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "sous-chef"
version = "v4.0.0"
description = "Sous-Chef data pipeline tool - Media cloud NLP pipeline configured via Python flows"
readme = "README.md"
requires-python = ">=3.13"
authors = [
  {name = "Paige Gulley", email = "pgulley@mediacloud.org"}
]

dependencies = [
  # Core data processing (numpy < 2.0 required by matplotlib 3.8.2)
  "pandas >= 2.2.0, < 3.0",
  "numpy >= 1.26.0, < 2.0",
  
  # Prefect orchestration
  "prefect >= 3.9.0",
  "prefect_aws >= 0.7.12",
  "prefect_email >= 0.4.3",
  
  # Data validation and models
  "pydantic >= 2.14.1",
  
  # MediaCloud integration
  "mediacloud >= 5.1.0",
  "mediacloud-metadata",
  
  # NLP and text processing
  "yake >= 0.7.3",
  "spacy",
  "spacy-download",
  "spacy-ngram",
  "torch",
  "transformers >= 4.37.2",
  "huggingface_hub >= 0.34.4",
  "uniseg >= 0.10.1",
  "protobuf >= 7.36.2",
  "sentencepiece >= 0.2.2",

  
  # Utilities
  "click >= 8.5.0",
  "requests >= 2.34.2",
  "python-dotenv >= 1.2.4",
  "jinja2 >= 3.1.6",
  "scrapy >= 2.14.2",
  
  # AWS/B2 storage
  "boto3 >= 1.43.0",  # exact version is bounded by aiobotocore (via prefect-aws)

  # LLM use (litellm caps openai < 3)
  "litellm >= 1.106.2",
  "instructor >= 1.17.0",
  "groq >= 1.7.0"
]

[project.optional-dependencies]
dev = [
  # Testing
  "pytest >= 9.1.1",
]


[tool.flit.module]
name = "sous_chef"
